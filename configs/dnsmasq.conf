# Core Daemon & Network Isolation

# prevent reading host's /etc/resolv.conf and polling for updates.
# this strictly isolates the sandbox from local os routing loops.
no-resolv
no-poll

# bind strictly to local loopback and bypass systemd-resolved (which binds to 127.0.0.53).
listen-address=127.0.0.1
bind-interfaces

# explicitly route public queries to public resolvers.
server=8.8.8.8
server=1.1.1.1


# Local Domain Isolation

# never forward .local queries to upstream public resolvers (prevents upstream leaks).
local=/local/


# Mock Records for DNS Failure Lab (brokendomain.local)

# failure scenario 1: multiple spf records (permerror)
txt-record=brokendomain.local,"v=spf1 include:_spf.google.com ~all"
txt-record=brokendomain.local,"v=spf1 include:sendgrid.net -all"

# failure scenario 2: dmarc completely missing
# (intentionally omitting _dmarc.brokendomain.local)

# failure scenario 3: mta-sts / tls-rpt missing
# (intentionally omitting _mta-sts and _smtp._tls)