services:
  mailserver:
    image: docker.io/mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: ${mail_hostname:-mail.example.com}
    env_file:
      - .env
    ports:
      - "25:25"     # smtp (required for inbound mta-to-mta transport)
      - "465:465"   # smtps (implicit tls client submission)
      - "587:587"   # submission (starttls)
      - "993:993"   # imaps (implicit tls)
      # plaintext client ports (143, 110) are intentionally dropped.
    volumes:
      - ./docker-maildata:/var/mail
      - ./docker-maildata-state:/var/mail-state
      - ./docker-maildata-logs:/var/log/mail
      - ./docker-config:/tmp/docker-mailserver
      # mount external let's encrypt certificates as read-only.
      - ./letsencrypt:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_net
    restart: always
    cap_add:
      - net_admin

networks:
  mail_net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2001:db8:1::/64